services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sooatel_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-sooatel}
    volumes:
      - sooatel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sooatel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/fiderana-niavo/sooatel_backend:latest
    container_name: sooatel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      TRANSFORMERS_CACHE: /app/.cache
    ports:
      - "3000:3000"

volumes:
  sooatel_pgdata:
